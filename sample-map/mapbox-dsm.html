<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drone Survey — Mapbox</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.js"></script>
  <script src="config.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #map { width: 100%; height: 100%; }

    #controls {
      position: fixed; top: 12px; left: 12px; z-index: 10;
      background: rgba(255,255,255,.92); backdrop-filter: blur(10px);
      border-radius: 10px; padding: 12px 16px; display: flex;
      flex-direction: column; gap: 10px; min-width: 210px;
      box-shadow: 0 2px 12px rgba(0,0,0,.2);
      font-family: system-ui, sans-serif; font-size: 13px;
    }
    #controls h3 { font-size: 13px; font-weight: 700; color: #111; }
    .divider { border: none; border-top: 1px solid #e5e7eb; margin: 2px 0; }
    .section-label { font-size: 11px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: .5px; }
    label { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: #333; }
    input[type=range] { width: 100px; accent-color: #3b82f6; }
    select { font-size: 12px; border: 1px solid #ccc; border-radius: 4px; padding: 2px 4px; }

    .legend { display: flex; flex-direction: column; gap: 5px; }
    .legend-item { display: flex; align-items: center; gap: 7px; font-size: 12px; color: #444; }
    .swatch { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; }
  </style>
</head>
<body>
<div id="map"></div>

<div id="controls">
  <h3>Drone Survey</h3>
  <hr class="divider" />

  <span class="section-label">Layers</span>
  <label>Ortho (RGB)
    <input type="checkbox" id="ortho-toggle" checked />
  </label>
  <label>Ortho opacity
    <input type="range" id="ortho-opacity" min="0" max="1" step="0.05" value="1" />
  </label>
  <label>DSM (elevation)
    <input type="checkbox" id="dsm-toggle" />
  </label>
  <label>DSM opacity
    <input type="range" id="dsm-opacity" min="0" max="1" step="0.05" value="0.6" />
  </label>

  <hr class="divider" />
  <span class="section-label">Bounds</span>
  <label>Show bounds
    <input type="checkbox" id="bounds-toggle" checked />
  </label>

  <hr class="divider" />
  <span class="section-label">Base map</span>
  <select id="basemap">
    <option value="illustrated" selected>Illustrated</option>
    <option value="mapbox://styles/mapbox/satellite-v9">Satellite</option>
    <option value="mapbox://styles/mapbox/outdoors-v12">Outdoors</option>
    <option value="mapbox://styles/mapbox/light-v11">Light</option>
  </select>

  <hr class="divider" />
  <div class="legend">
    <div class="legend-item"><div class="swatch" style="background:#22c55e;opacity:.6"></div>Ortho RGB</div>
    <div class="legend-item"><div class="swatch" style="background:#3b82f6;opacity:.6"></div>DSM elevation</div>
    <div class="legend-item"><div class="swatch" style="border:2px dashed #f97316;background:transparent"></div>Tileset bounds</div>
  </div>
</div>

<script>
  mapboxgl.accessToken = window.MAPBOX_TOKEN;

  const ORTHO_ID = 'aravindmetku.m7cf2h';
  const DSM_ID   = 'aravindmetku.1hwfrz';

  const ORTHO_BOUNDS = [-91.99501800570091, 46.841822739546636, -91.99277489214654, 46.84333418957499];
  const DSM_BOUNDS   = [-92.01631790889132, 46.843992474039155, -92.01409083710324, 46.84550335691156];
  const ORTHO_CENTER = [-91.99389644892372, 46.842578464560816];

  function boundsPolygon(b) {
    return {
      type: 'Feature',
      geometry: {
        type: 'Polygon',
        coordinates: [[[b[0],b[1]],[b[2],b[1]],[b[2],b[3]],[b[0],b[3]],[b[0],b[1]]]],
      },
    };
  }

  const ILLUSTRATED_STYLE = {"version":8,"name":"Park Illustrated","sprite":"mapbox://sprites/mapbox/outdoors-v12","glyphs":"mapbox://fonts/mapbox/{fontstack}/{range}.pbf","sources":{"composite":{"type":"vector","url":"mapbox://mapbox.mapbox-streets-v8,mapbox.mapbox-terrain-v2,mapbox.mapbox-bathymetry-v2"}},"layers":[{"id":"background","type":"background","paint":{"background-color":"#f5f0e8"}},{"id":"landcover","type":"fill","source":"composite","source-layer":"landcover","maxzoom":12,"paint":{"fill-color":"#c8e6c0","fill-opacity":0.8}},{"id":"park","type":"fill","source":"composite","source-layer":"landuse","filter":["match",["get","class"],["park","national_park","pitch","grass"],true,false],"paint":{"fill-color":"#b2d8a8","fill-opacity":0.9}},{"id":"landuse-other","type":"fill","source":"composite","source-layer":"landuse","filter":["match",["get","class"],["residential","industrial","commercial_area"],true,false],"paint":{"fill-color":"#dce8d0","fill-opacity":0.6}},{"id":"water","type":"fill","source":"composite","source-layer":"water","paint":{"fill-color":"#89cff0"}},{"id":"waterway","type":"line","source":"composite","source-layer":"waterway","minzoom":8,"layout":{"line-cap":"round","line-join":"round"},"paint":{"line-color":"#89cff0","line-width":["interpolate",["linear"],["zoom"],10,1,16,4]}},{"id":"path-case","type":"line","source":"composite","source-layer":"road","minzoom":13,"filter":["==",["get","class"],"path"],"layout":{"line-cap":"round","line-join":"round"},"paint":{"line-color":"#e8c898","line-width":["interpolate",["linear"],["zoom"],13,2,18,6]}},{"id":"path","type":"line","source":"composite","source-layer":"road","minzoom":13,"filter":["==",["get","class"],"path"],"layout":{"line-cap":"butt","line-join":"round"},"paint":{"line-color":"#c8a878","line-width":["interpolate",["linear"],["zoom"],13,1,18,3.5],"line-dasharray":[2,1.5]}},{"id":"pedestrian","type":"line","source":"composite","source-layer":"road","minzoom":13,"filter":["==",["get","class"],"pedestrian"],"layout":{"line-cap":"butt","line-join":"round"},"paint":{"line-color":"#c8a878","line-width":["interpolate",["linear"],["zoom"],13,1,18,3.5],"line-dasharray":[2,1.5]}},{"id":"road-minor","type":"line","source":"composite","source-layer":"road","minzoom":13,"filter":["match",["get","class"],["street","street_limited","service","track"],true,false],"layout":{"line-cap":"round","line-join":"round"},"paint":{"line-color":"#f0e8d8","line-width":["interpolate",["linear"],["zoom"],13,2,18,8]}},{"id":"road-secondary","type":"line","source":"composite","source-layer":"road","minzoom":9,"filter":["match",["get","class"],["secondary","tertiary"],true,false],"layout":{"line-cap":"round","line-join":"round"},"paint":{"line-color":"#ffe4a0","line-width":["interpolate",["linear"],["zoom"],9,1.5,18,10]}},{"id":"road-primary","type":"line","source":"composite","source-layer":"road","minzoom":6,"filter":["match",["get","class"],["primary","trunk","motorway"],true,false],"layout":{"line-cap":"round","line-join":"round"},"paint":{"line-color":"#ffd080","line-width":["interpolate",["linear"],["zoom"],6,1,18,14]}},{"id":"building","type":"fill","source":"composite","source-layer":"building","minzoom":15,"paint":{"fill-color":"#e8dcc8","fill-outline-color":"#c8b89a"}},{"id":"road-label","type":"symbol","source":"composite","source-layer":"road","minzoom":12,"filter":["has","name"],"layout":{"symbol-placement":"line","text-field":["coalesce",["get","name_en"],["get","name"]],"text-font":["DIN Offc Pro Medium","Arial Unicode MS Regular"],"text-size":["interpolate",["linear"],["zoom"],12,10,16,13],"text-max-angle":30},"paint":{"text-color":"#4a3728","text-halo-color":"#ffffff","text-halo-width":1.5}},{"id":"water-label","type":"symbol","source":"composite","source-layer":"natural_label","minzoom":6,"filter":["match",["get","class"],["water","ocean","sea","bay","reservoir","canal","river","stream"],true,false],"layout":{"symbol-placement":"point","text-field":["coalesce",["get","name_en"],["get","name"]],"text-font":["DIN Offc Pro Medium","Arial Unicode MS Regular"],"text-size":["interpolate",["linear"],["zoom"],6,10,14,14]},"paint":{"text-color":"#2980b9","text-halo-color":"#ffffff","text-halo-width":1.5}},{"id":"place-label","type":"symbol","source":"composite","source-layer":"place_label","minzoom":4,"maxzoom":14,"layout":{"text-field":["coalesce",["get","name_en"],["get","name"]],"text-font":["DIN Offc Pro Medium","Arial Unicode MS Regular"],"text-size":["interpolate",["linear"],["zoom"],4,10,12,15],"text-max-width":7},"paint":{"text-color":"#4a3728","text-halo-color":"#ffffff","text-halo-width":1.5}}]};

  const map = new mapboxgl.Map({
    container: 'map',
    style: ILLUSTRATED_STYLE,
    center: ORTHO_CENTER,
    zoom: 17,
    hash: true,
  });

  map.addControl(new mapboxgl.NavigationControl(), 'bottom-right');
  map.addControl(new mapboxgl.ScaleControl(), 'bottom-left');

  function addLayers() {
    // --- Ortho RGB ---
    if (!map.getSource('ortho')) {
      map.addSource('ortho', { type: 'raster', url: `mapbox://${ORTHO_ID}`, tileSize: 256 });
      map.addLayer({ id: 'ortho-layer', type: 'raster', source: 'ortho',
        paint: { 'raster-opacity': 1, 'raster-resampling': 'linear' } });
    }

    // --- DSM elevation ---
    if (!map.getSource('dsm')) {
      map.addSource('dsm', { type: 'raster', url: `mapbox://${DSM_ID}`, tileSize: 256 });
      map.addLayer({ id: 'dsm-layer', type: 'raster', source: 'dsm',
        layout: { visibility: 'none' },
        paint: { 'raster-opacity': 0.6, 'raster-resampling': 'linear',
          'raster-color': ['interpolate', ['linear'], ['raster-value'],
            0,   '#0d0887',
            64,  '#7e03a8',
            128, '#cc4778',
            192, '#f89540',
            255, '#f0f921',
          ],
          'raster-color-range': [0, 255],
        },
      });
    }

    // --- Bounds ---
    if (!map.getSource('ortho-bounds')) {
      map.addSource('ortho-bounds', { type: 'geojson', data: boundsPolygon(ORTHO_BOUNDS) });
      map.addLayer({ id: 'ortho-bounds-fill', type: 'fill', source: 'ortho-bounds',
        paint: { 'fill-color': '#22c55e', 'fill-opacity': 0.07 } });
      map.addLayer({ id: 'ortho-bounds-line', type: 'line', source: 'ortho-bounds',
        paint: { 'line-color': '#22c55e', 'line-width': 2, 'line-dasharray': [4, 2] } });
    }

    if (!map.getSource('dsm-bounds')) {
      map.addSource('dsm-bounds', { type: 'geojson', data: boundsPolygon(DSM_BOUNDS) });
      map.addLayer({ id: 'dsm-bounds-fill', type: 'fill', source: 'dsm-bounds',
        paint: { 'fill-color': '#3b82f6', 'fill-opacity': 0.07 } });
      map.addLayer({ id: 'dsm-bounds-line', type: 'line', source: 'dsm-bounds',
        paint: { 'line-color': '#3b82f6', 'line-width': 2, 'line-dasharray': [4, 2] } });
    }

    // Labels
    if (!map.getSource('bounds-labels')) {
      map.addSource('bounds-labels', {
        type: 'geojson',
        data: {
          type: 'FeatureCollection',
          features: [
            { type: 'Feature', geometry: { type: 'Point', coordinates: [ORTHO_BOUNDS[0], ORTHO_BOUNDS[3]] },
              properties: { label: 'Ortho RGB' } },
            { type: 'Feature', geometry: { type: 'Point', coordinates: [DSM_BOUNDS[0], DSM_BOUNDS[3]] },
              properties: { label: 'DSM elevation' } },
          ],
        },
      });
      map.addLayer({ id: 'bounds-labels', type: 'symbol', source: 'bounds-labels',
        layout: { 'text-field': ['get', 'label'], 'text-size': 12,
          'text-anchor': 'bottom-left', 'text-offset': [0.3, -0.3] },
        paint: { 'text-color': '#f97316', 'text-halo-color': '#fff', 'text-halo-width': 1.5 },
      });
    }
  }

  map.on('load', addLayers);

  // Controls
  document.getElementById('ortho-toggle').addEventListener('change', e => {
    map.setLayoutProperty('ortho-layer', 'visibility', e.target.checked ? 'visible' : 'none');
  });
  document.getElementById('ortho-opacity').addEventListener('input', e => {
    map.setPaintProperty('ortho-layer', 'raster-opacity', parseFloat(e.target.value));
  });
  document.getElementById('dsm-toggle').addEventListener('change', e => {
    map.setLayoutProperty('dsm-layer', 'visibility', e.target.checked ? 'visible' : 'none');
  });
  document.getElementById('dsm-opacity').addEventListener('input', e => {
    map.setPaintProperty('dsm-layer', 'raster-opacity', parseFloat(e.target.value));
  });

  document.getElementById('bounds-toggle').addEventListener('change', e => {
    const v = e.target.checked ? 'visible' : 'none';
    ['ortho-bounds-fill','ortho-bounds-line','dsm-bounds-fill','dsm-bounds-line','bounds-labels']
      .forEach(id => { if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', v); });
  });

  document.getElementById('basemap').addEventListener('change', e => {
    const val = e.target.value;
    map.setStyle(val === 'illustrated' ? ILLUSTRATED_STYLE : val);
    map.once('style.load', addLayers);
  });
</script>
</body>
</html>
