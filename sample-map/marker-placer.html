<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marker Placer — Experium Park</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { display: flex; height: 100vh; font-family: system-ui, sans-serif; background: #0f172a; }

    #map { flex: 1; cursor: crosshair; }

    #sidebar {
      width: 320px;
      display: flex;
      flex-direction: column;
      background: #1e293b;
      color: #f1f5f9;
      border-left: 1px solid #334155;
    }

    #sidebar h1 {
      font-size: 14px;
      font-weight: 600;
      padding: 14px 16px 10px;
      border-bottom: 1px solid #334155;
      color: #94a3b8;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    #hint {
      font-size: 12px;
      color: #64748b;
      padding: 10px 16px;
      border-bottom: 1px solid #334155;
    }

    #table-wrap {
      flex: 1;
      overflow-y: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    thead th {
      position: sticky;
      top: 0;
      background: #1e293b;
      padding: 8px 12px;
      text-align: left;
      color: #94a3b8;
      font-weight: 500;
      border-bottom: 1px solid #334155;
    }

    tbody tr { cursor: pointer; }
    tbody tr:hover { background: #273548; }

    tbody td {
      padding: 7px 12px;
      border-bottom: 1px solid #1e293b;
      color: #e2e8f0;
      font-variant-numeric: tabular-nums;
    }

    tbody td:first-child { color: #38bdf8; font-weight: 600; }

    .del-btn {
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-size: 14px;
      padding: 0 4px;
      line-height: 1;
    }
    .del-btn:hover { color: #f87171; }

    #actions {
      padding: 12px 16px;
      border-top: 1px solid #334155;
      display: flex;
      gap: 8px;
    }

    button.primary {
      flex: 1;
      padding: 9px 12px;
      background: #0ea5e9;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button.primary:hover { background: #38bdf8; }
    button.primary:disabled { background: #334155; color: #64748b; cursor: default; }

    button.secondary {
      padding: 9px 12px;
      background: #334155;
      color: #94a3b8;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    button.secondary:hover { background: #475569; color: #e2e8f0; }

    #search-wrap {
      padding: 8px 12px;
      border-bottom: 1px solid #334155;
    }
    #search-input {
      width: 100%;
      padding: 7px 10px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #f1f5f9;
      font-size: 13px;
    }
    #search-input:focus { outline: none; border-color: #0ea5e9; }
    #search-input::placeholder { color: #475569; }

    /* custom marker pin */
    .pin {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      background: #f97316;
      border: 2px solid #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
      cursor: grab;
    }
    .pin:active { cursor: grabbing; }
    .pin span {
      transform: rotate(45deg);
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      line-height: 1;
    }

    .pin.unsectioned { background: #64748b; }
    .pin span { white-space: nowrap; }

    /* sections */
    #sections-wrap { border-bottom: 1px solid #334155; padding: 8px 12px; }
    #sections-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    #sections-head button { padding: 5px 10px; font-size: 12px; }
    #sections-list { max-height: 110px; overflow-y: auto; font-size: 13px; }
    .sec-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; }
    .sec-row:hover { color: #fff; }
    .sec-swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; }
    .sec-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sec-count { color: #64748b; font-variant-numeric: tabular-nums; }
    .icon-btn {
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 14px;
      padding: 0 4px;
      line-height: 1;
    }
    .icon-btn:hover, .icon-btn.active { color: #38bdf8; }
    .sec-row.editing { color: #38bdf8; }
    .vertex-handle {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid #0ea5e9;
      box-shadow: 0 1px 4px rgba(0,0,0,0.6);
      cursor: grab;
    }
    .vertex-handle:active { cursor: grabbing; }
    .sec-label {
      pointer-events: none;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
      white-space: nowrap;
    }
    tbody tr.unsectioned td:first-child { color: #fbbf24; }
    #status { padding: 6px 16px 0; font-size: 12px; color: #fbbf24; }
    #status:empty { display: none; }

    /* number input popup */
    #popup {
      position: fixed;
      display: none;
      z-index: 100;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 14px 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      min-width: 200px;
    }
    #popup label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; }
    #popup input {
      width: 100%;
      padding: 8px 10px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #f1f5f9;
      font-size: 14px;
      margin-bottom: 10px;
    }
    #popup input:focus { outline: none; border-color: #0ea5e9; }
    #popup-actions { display: flex; gap: 8px; }
    #popup-actions button { flex: 1; padding: 7px; border: none; border-radius: 5px; font-size: 13px; font-weight: 600; cursor: pointer; }
    #popup-confirm { background: #0ea5e9; color: #fff; }
    #popup-confirm:hover { background: #38bdf8; }
    #popup-cancel { background: #334155; color: #94a3b8; }
    #popup-cancel:hover { background: #475569; }
  </style>
</head>
<body>

<div id="map"></div>

<div id="sidebar">
  <h1>Marker Placer</h1>
  <div id="hint"></div>
  <div id="sections-wrap">
    <div id="sections-head">
      <span>Sections</span>
      <button class="secondary" id="draw-btn">Draw section</button>
    </div>
    <div id="sections-list"></div>
  </div>
  <div id="search-wrap">
    <input type="text" id="search-input" placeholder="Search by marker (e.g. A3)…">
  </div>
  <div id="table-wrap">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Latitude</th>
          <th>Longitude</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div id="status"></div>
  <div id="actions">
    <button class="primary" id="export-btn" disabled>Export JSON</button>
    <button class="secondary" id="import-btn">Import JSON</button>
    <button class="secondary" id="clear-btn">Clear</button>
  </div>
  <input type="file" id="import-input" accept=".json" style="display:none">
</div>

<!-- number entry popup -->
<div id="popup">
  <label id="popup-label">Marker number</label>
  <input type="number" id="popup-input" min="1" step="1" placeholder="e.g. 42">
  <div id="popup-actions">
    <button id="popup-confirm">Add</button>
    <button id="popup-cancel">Cancel</button>
  </div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js"></script>
<script>
  // ── PMTiles protocol ───────────────────────────────────────────────────────
  const protocol = new pmtiles.Protocol()
  maplibregl.addProtocol('pmtiles', protocol.tile.bind(protocol))

  // ── Map ────────────────────────────────────────────────────────────────────
  const BOUNDS = [78.187123, 17.378546, 78.196134, 17.383978]
  const CENTER = [(BOUNDS[0] + BOUNDS[2]) / 2, (BOUNDS[1] + BOUNDS[3]) / 2]

  const map = new maplibregl.Map({
    container: 'map',
    style: {
      version: 8,
      sources: {
        park: {
          type: 'raster',
          url: 'pmtiles:///park.pmtiles',
          tileSize: 256,
          minzoom: 15,
          maxzoom: 21,
        },
      },
      layers: [
        { id: 'bg', type: 'background', paint: { 'background-color': '#0f172a' } },
        { id: 'park', type: 'raster', source: 'park' },
      ],
    },
    center: CENTER,
    zoom: 19.5,
    maxBounds: [BOUNDS[0] - 0.002, BOUNDS[1] - 0.002, BOUNDS[2] + 0.002, BOUNDS[3] + 0.002],
    minZoom: 15,
  })

  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-left')

  // ── State ──────────────────────────────────────────────────────────────────
  const COLORS = ['#38bdf8', '#a78bfa', '#34d399', '#fbbf24', '#f472b6', '#fb923c', '#22d3ee', '#a3e635']
  const sections = []         // { id, polygon: [[lng, lat], ...], color, label }
  const markers = []          // { section (id | null), number, lat, lng, mapMarker, el }
  let pendingLngLat = null    // lngLat waiting for number input
  let pendingSection = null   // section the pending marker will belong to
  let drawing = null          // [[lng, lat], ...] while drawing a section, else null
  let editing = null          // { sec, handles } while reshaping a section, else null
  let searchQuery = ''

  const hint = document.getElementById('hint')
  const drawBtn = document.getElementById('draw-btn')

  function updateHint() {
    hint.style.color = ''
    hint.textContent = drawing
      ? 'Drawing: click to add points · click first point or Enter to finish · Esc cancels'
      : editing
        ? `Editing ${editing.sec.id}: drag the points to reshape · Esc or ⬡ to finish`
        : 'Click inside a section to place a marker · Drag to reposition.'
  }

  function flashHint(msg) {
    hint.style.color = '#f97316'
    hint.textContent = msg
    setTimeout(updateHint, 2500)
  }
  updateHint()

  // ── Geometry ───────────────────────────────────────────────────────────────
  function pointInPolygon(lng, lat, poly) {
    let inside = false
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const [xi, yi] = poly[i], [xj, yj] = poly[j]
      if ((yi > lat) !== (yj > lat) && lng < (xj - xi) * (lat - yi) / (yj - yi) + xi) inside = !inside
    }
    return inside
  }

  // overlapping sections: first one in the list wins
  function sectionAt(lng, lat) {
    return sections.find(s => pointInPolygon(lng, lat, s.polygon)) ?? null
  }

  function nextNumber(sectionId) {
    const nums = markers.filter(m => m.section === sectionId).map(m => m.number)
    return (nums.length ? Math.max(...nums) : 0) + 1
  }

  // ── Section layers ─────────────────────────────────────────────────────────
  const EMPTY = { type: 'FeatureCollection', features: [] }

  map.on('load', () => {
    map.addSource('sections', { type: 'geojson', data: EMPTY })
    map.addLayer({ id: 'sections-fill', type: 'fill', source: 'sections',
      paint: { 'fill-color': ['get', 'color'], 'fill-opacity': 0.18 } })
    map.addLayer({ id: 'sections-line', type: 'line', source: 'sections',
      paint: { 'line-color': ['get', 'color'], 'line-width': 2 } })
    map.addSource('draft', { type: 'geojson', data: EMPTY })
    map.addLayer({ id: 'draft-line', type: 'line', source: 'draft',
      filter: ['==', ['geometry-type'], 'LineString'],
      paint: { 'line-color': '#fff', 'line-width': 2, 'line-dasharray': [2, 2] } })
    map.addLayer({ id: 'draft-pts', type: 'circle', source: 'draft',
      filter: ['==', ['geometry-type'], 'Point'],
      paint: { 'circle-radius': 5, 'circle-color': '#fff', 'circle-stroke-color': '#0ea5e9', 'circle-stroke-width': 2 } })
    refreshSections()
    refreshDraft()
  })

  function refreshSections() {
    map.getSource('sections')?.setData({
      type: 'FeatureCollection',
      features: sections.map(s => ({
        type: 'Feature',
        properties: { color: s.color },
        geometry: { type: 'Polygon', coordinates: [[...s.polygon, s.polygon[0]]] },
      })),
    })
  }

  function refreshDraft() {
    const pts = drawing ?? []
    const features = pts.map(c => ({ type: 'Feature', properties: {}, geometry: { type: 'Point', coordinates: c } }))
    if (pts.length > 1) features.push({ type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: pts } })
    map.getSource('draft')?.setData({ type: 'FeatureCollection', features })
  }

  // ── Sections ───────────────────────────────────────────────────────────────
  const centroid = (polygon) =>
    polygon.reduce(([x, y], [lng, lat]) => [x + lng, y + lat], [0, 0]).map(v => v / polygon.length)

  function addSection(id, polygon) {
    const color = COLORS[sections.length % COLORS.length]
    const el = document.createElement('div')
    el.className = 'sec-label'
    el.textContent = id
    const label = new maplibregl.Marker({ element: el, anchor: 'center' }).setLngLat(centroid(polygon)).addTo(map)
    sections.push({ id, polygon, color, label })
    refreshSections()
    renderSections()
  }

  // changes the letter; its markers are re-IDed (A3 → C3), numbers stay
  function renameSection(id) {
    const sec = sections.find(s => s.id === id)
    if (!sec) return
    const input = prompt(`New letter for section ${id}`, id)
    if (input === null) return
    const newId = input.trim().toUpperCase()
    if (newId === id) return
    if (!/^[A-Z]+$/.test(newId) || sections.some(s => s.id === newId)) {
      alert('Section letter must be letters only and unique.')
      return
    }
    markers.filter(m => m.section === id).forEach(m => { m.section = newId; refreshPin(m) })
    sec.id = newId
    sec.label.getElement().textContent = newId
    updateHint()
    sortMarkers()
    renderTable()
  }

  // ── Reshape section: drag its points ───────────────────────────────────────
  function startEditing(sec) {
    if (drawing) return
    stopEditing()
    const handles = sec.polygon.map((coord, i) => {
      const el = document.createElement('div')
      el.className = 'vertex-handle'
      el.addEventListener('click', (e) => e.stopPropagation())
      const handle = new maplibregl.Marker({ element: el, draggable: true }).setLngLat(coord).addTo(map)
      let before = coord
      handle.on('dragstart', () => { before = sec.polygon[i] })
      handle.on('drag', () => {
        const { lng, lat } = handle.getLngLat()
        sec.polygon[i] = [lng, lat]
        sec.label.setLngLat(centroid(sec.polygon))
        refreshSections()
      })
      handle.on('dragend', () => {
        // every marker must stay inside its section
        const stranded = markers.filter(m => m.section === sec.id && !pointInPolygon(m.lng, m.lat, sec.polygon))
        if (stranded.length) {
          sec.polygon[i] = before
          handle.setLngLat(before)
          sec.label.setLngLat(centroid(sec.polygon))
          refreshSections()
          flashHint(`Would leave ${stranded.map(labelOf).join(', ')} outside ${sec.id}`)
        }
      })
      return handle
    })
    editing = { sec, handles }
    updateHint()
    renderSections()
  }

  function stopEditing() {
    if (!editing) return
    editing.handles.forEach(h => h.remove())
    editing = null
    updateHint()
    renderSections()
  }

  function removeSection(id) {
    const idx = sections.findIndex(s => s.id === id)
    if (idx === -1) return
    if (markers.some(m => m.section === id)) {
      alert(`Section ${id} still has markers. Remove or move them first.`)
      return
    }
    if (editing?.sec === sections[idx]) stopEditing()
    sections[idx].label.remove()
    sections.splice(idx, 1)
    refreshSections()
    renderSections()
  }

  function renderSections() {
    const list = document.getElementById('sections-list')
    list.innerHTML = sections.map(s => `
      <div class="sec-row${editing?.sec === s ? ' editing' : ''}" data-id="${s.id}">
        <span class="sec-swatch" style="background:${s.color}"></span>
        <span class="sec-name">${s.id}</span>
        <span class="sec-count">${markers.filter(m => m.section === s.id).length}</span>
        <button class="icon-btn rename-btn" data-id="${s.id}" title="Change letter">✎</button>
        <button class="icon-btn edit-btn${editing?.sec === s ? ' active' : ''}" data-id="${s.id}" title="Reshape section">⬡</button>
        <button class="del-btn" data-id="${s.id}" title="Delete section">✕</button>
      </div>
    `).join('')
    list.querySelectorAll('.rename-btn').forEach(btn => {
      btn.addEventListener('click', () => renameSection(btn.dataset.id))
    })
    list.querySelectorAll('.edit-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const sec = sections.find(x => x.id === btn.dataset.id)
        if (editing?.sec === sec) stopEditing()
        else startEditing(sec)
      })
    })
    list.querySelectorAll('.sec-row').forEach(row => {
      row.addEventListener('click', (e) => {
        if (e.target.closest('button')) return
        const s = sections.find(x => x.id === row.dataset.id)
        if (!s) return
        const lngs = s.polygon.map(p => p[0]), lats = s.polygon.map(p => p[1])
        map.fitBounds([[Math.min(...lngs), Math.min(...lats)], [Math.max(...lngs), Math.max(...lats)]], { padding: 60 })
      })
    })
    list.querySelectorAll('.del-btn').forEach(btn => {
      btn.addEventListener('click', () => removeSection(btn.dataset.id))
    })
  }

  // ── Draw section ───────────────────────────────────────────────────────────
  function startDrawing() {
    stopEditing()
    drawing = []
    map.doubleClickZoom.disable()
    drawBtn.textContent = 'Finish'
    updateHint()
    refreshDraft()
  }

  function stopDrawing() {
    drawing = null
    map.doubleClickZoom.enable()
    drawBtn.textContent = 'Draw section'
    updateHint()
    refreshDraft()
  }

  function finishDrawing() {
    if (drawing.length < 3) { flashHint('Need at least 3 points'); return }
    const idInput = prompt('Section letter (e.g. A)')
    if (idInput === null) return
    const id = idInput.trim().toUpperCase()
    if (!/^[A-Z]+$/.test(id) || sections.some(s => s.id === id)) {
      alert('Section letter must be letters only and unique.')
      return
    }
    const polygon = drawing
    stopDrawing()
    addSection(id, polygon)
    assignUnsectioned()
  }

  drawBtn.addEventListener('click', () => (drawing ? finishDrawing() : startDrawing()))

  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return
    if (drawing) {
      if (e.key === 'Enter') finishDrawing()
      if (e.key === 'Escape') stopDrawing()
    } else if (editing && e.key === 'Escape') {
      stopEditing()
    }
  })

  // ── Popup logic ────────────────────────────────────────────────────────────
  const popup   = document.getElementById('popup')
  const input   = document.getElementById('popup-input')
  const confirm = document.getElementById('popup-confirm')
  const cancel  = document.getElementById('popup-cancel')

  function showPopup(x, y, defaultNum) {
    popup.style.display = 'block'
    // keep popup on screen
    const pw = 220, ph = 120
    const vw = window.innerWidth, vh = window.innerHeight
    popup.style.left = Math.min(x + 12, vw - pw - 8) + 'px'
    popup.style.top  = Math.min(y - 10, vh - ph - 8) + 'px'
    input.value = defaultNum
    input.focus()
    input.select()
  }

  function hidePopup() {
    popup.style.display = 'none'
    pendingLngLat = null
    pendingSection = null
  }

  // ── Map click ─────────────────────────────────────────────────────────────
  map.on('click', (e) => {
    if (drawing) {
      if (drawing.length >= 3) {
        const first = map.project(drawing[0])
        if (Math.hypot(first.x - e.point.x, first.y - e.point.y) < 12) return finishDrawing()
      }
      drawing.push([e.lngLat.lng, e.lngLat.lat])
      refreshDraft()
      return
    }

    if (editing) return

    const sec = sectionAt(e.lngLat.lng, e.lngLat.lat)
    if (!sec) { flashHint('Click inside a section to place a marker'); return }

    // figure out pixel position of click for popup placement
    const rect = map.getCanvas().getBoundingClientRect()
    pendingLngLat = e.lngLat
    pendingSection = sec
    document.getElementById('popup-label').textContent = `Marker number in section ${sec.id}`
    showPopup(rect.left + e.point.x, rect.top + e.point.y, nextNumber(sec.id))
  })

  confirm.addEventListener('click', commitMarker)
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') commitMarker()
    if (e.key === 'Escape') hidePopup()
  })
  cancel.addEventListener('click', hidePopup)

  function commitMarker() {
    const num = parseInt(input.value, 10)
    if (!pendingLngLat || !pendingSection || isNaN(num) || num < 1) return
    addMarker(pendingSection.id, num, pendingLngLat.lat, pendingLngLat.lng)
    hidePopup()
  }

  // ── Markers ───────────────────────────────────────────────────────────────
  const labelOf = (m) => m.section ? `${m.section}${m.number}` : `#${m.number}`

  function refreshPin(m) {
    m.el.className = m.section ? 'pin' : 'pin unsectioned'
    m.el.innerHTML = `<span>${labelOf(m)}</span>`
    m.el.title = `${labelOf(m)} — drag to move · click to remove`
  }

  // section = null → not yet in a section (legacy import); must be resolved before export
  function addMarker(section, num, lat, lng) {
    // replace existing marker with same section + number if present
    const existing = markers.findIndex(m => m.section === section && m.number === num)
    if (existing !== -1) {
      markers[existing].mapMarker.remove()
      markers.splice(existing, 1)
    }

    const el = document.createElement('div')
    const entry = { section, number: num, lat, lng, mapMarker: null, el }
    refreshPin(entry)

    let wasDragged = false
    el.addEventListener('click', (e) => {
      e.stopPropagation()
      if (wasDragged) { wasDragged = false; return }
      removeMarker(entry)
    })

    const mapMarker = new maplibregl.Marker({ element: el, anchor: 'bottom-left', draggable: true })
      .setLngLat([lng, lat])
      .addTo(map)
    entry.mapMarker = mapMarker

    mapMarker.on('dragstart', () => { wasDragged = true })
    mapMarker.on('dragend', () => {
      const pos = mapMarker.getLngLat()
      const sec = sectionAt(pos.lng, pos.lat)
      if (entry.section !== null && !sec) {
        mapMarker.setLngLat([entry.lng, entry.lat])
        flashHint('Markers must stay inside a section')
        return
      }
      if (sec && sec.id !== entry.section) {
        entry.number = nextNumber(sec.id)
        entry.section = sec.id
        refreshPin(entry)
      }
      entry.lat = pos.lat
      entry.lng = pos.lng
      sortMarkers()
      renderTable()
    })

    markers.push(entry)
    sortMarkers()
    renderTable()
  }

  function removeMarker(entry) {
    const idx = markers.indexOf(entry)
    if (idx === -1) return
    entry.mapMarker.remove()
    markers.splice(idx, 1)
    renderTable()
  }

  // unsectioned first, then by section order, then number
  function sortMarkers() {
    const rank = (m) => sections.findIndex(s => s.id === m.section)
    markers.sort((a, b) => rank(a) - rank(b) || a.number - b.number)
  }

  // give each unsectioned marker the next free number in the section it sits in
  function assignUnsectioned() {
    markers.filter(m => m.section === null).sort((a, b) => a.number - b.number).forEach(m => {
      const sec = sectionAt(m.lng, m.lat)
      if (!sec) return
      m.number = nextNumber(sec.id)
      m.section = sec.id
      refreshPin(m)
    })
    sortMarkers()
    renderTable()
  }

  // ── Table ──────────────────────────────────────────────────────────────────
  const tbody = document.getElementById('tbody')
  const exportBtn = document.getElementById('export-btn')
  const status = document.getElementById('status')

  function renderTable() {
    tbody.innerHTML = markers.map((m, i) => `
      <tr data-idx="${i}" class="${m.section ? '' : 'unsectioned'}">
        <td>${labelOf(m)}</td>
        <td>${m.lat.toFixed(7)}</td>
        <td>${m.lng.toFixed(7)}</td>
        <td><button class="del-btn" data-idx="${i}" title="Remove">✕</button></td>
      </tr>
    `).join('')

    tbody.querySelectorAll('tr').forEach(row => {
      row.addEventListener('click', (e) => {
        if (e.target.closest('.del-btn')) return
        const m = markers[parseInt(row.dataset.idx, 10)]
        if (m) map.flyTo({ center: [m.lng, m.lat], zoom: map.getZoom() })
      })
    })

    tbody.querySelectorAll('.del-btn').forEach(btn => {
      btn.addEventListener('click', () => removeMarker(markers[parseInt(btn.dataset.idx, 10)]))
    })

    const pending = markers.filter(m => m.section === null).length
    status.textContent = pending ? `${pending} marker(s) not in a section — export disabled` : ''
    exportBtn.disabled = pending > 0 || (markers.length === 0 && sections.length === 0)
    renderSections()
    applyFilter()
  }

  // ── Search / filter ────────────────────────────────────────────────────────
  function applyFilter() {
    const q = searchQuery.toUpperCase()
    Array.from(tbody.querySelectorAll('tr')).forEach(row => {
      const label = row.cells[0]?.textContent.toUpperCase() ?? ''
      row.style.display = (!q || label.includes(q)) ? '' : 'none'
    })
    if (q) {
      const exact = markers.find(m => labelOf(m).toUpperCase() === q)
      if (exact) map.flyTo({ center: [exact.lng, exact.lat], zoom: map.getZoom() })
    }
  }

  document.getElementById('search-input').addEventListener('input', (e) => {
    searchQuery = e.target.value.trim()
    applyFilter()
  })

  // ── Clear all ─────────────────────────────────────────────────────────────
  function clearMarkers() {
    markers.forEach(m => m.mapMarker.remove())
    markers.length = 0
  }

  function clearSections() {
    stopEditing()
    sections.forEach(s => s.label.remove())
    sections.length = 0
    refreshSections()
  }

  document.getElementById('clear-btn').addEventListener('click', () => {
    if (!markers.length && !sections.length) return
    if (!window.confirm(`Remove all ${markers.length} markers and ${sections.length} sections?`)) return
    clearMarkers()
    clearSections()
    renderTable()
  })

  // ── Export JSON ───────────────────────────────────────────────────────────
  exportBtn.addEventListener('click', () => {
    const data = {
      sections: sections.map(({ id, polygon }) => ({ id, polygon })),
      markers: markers.map(({ section, number, lat, lng }) => ({ id: `${section}${number}`, section, number, lat, lng })),
    }
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' })
    const a = document.createElement('a')
    a.href = URL.createObjectURL(blob)
    a.download = 'markers.json'
    a.click()
    URL.revokeObjectURL(a.href)
  })

  // ── Import JSON ───────────────────────────────────────────────────────────
  // Accepts the new { sections, markers } object, or the legacy bare [{ number, lat, lng }] array.
  // Legacy markers have no section: existing sections are kept and markers inside them are assigned;
  // the rest stay unsectioned (grey) until a section is drawn around them.
  document.getElementById('import-btn').addEventListener('click', () => {
    document.getElementById('import-input').click()
  })

  const isNum = (v) => typeof v === 'number' && isFinite(v)
  const validPolygon = (p) => Array.isArray(p) && p.length >= 3 && p.every(c => Array.isArray(c) && isNum(c[0]) && isNum(c[1]))

  document.getElementById('import-input').addEventListener('change', (e) => {
    const file = e.target.files[0]
    if (!file) return
    const reader = new FileReader()
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result)
        const legacy = Array.isArray(data)
        if (!legacy && !(data && Array.isArray(data.markers))) throw new Error('Expected array or { sections, markers }')

        clearMarkers()
        if (!legacy) {
          clearSections()
          for (const s of data.sections ?? []) {
            if (typeof s.id !== 'string' || !validPolygon(s.polygon) || sections.some(x => x.id === s.id)) continue
            addSection(s.id, s.polygon)
          }
        }
        for (const item of legacy ? data : data.markers) {
          const { number, lat, lng } = item
          if (!isNum(number) || !isNum(lat) || !isNum(lng)) continue
          const known = !legacy && typeof item.section === 'string' && sections.some(s => s.id === item.section)
          addMarker(known ? item.section : null, number, lat, lng)
        }
        assignUnsectioned()
        renderTable()
      } catch (err) {
        alert('Invalid JSON file: ' + err.message)
      }
      // reset so the same file can be re-imported
      e.target.value = ''
    }
    reader.readAsText(file)
  })
</script>
</body>
</html>
