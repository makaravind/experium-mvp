<!DOCTYPE html>
<html data-theme="luxury" lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nav Path Animation Options</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5.5.19/daisyui.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5.5.19/themes.css">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.2.4/dist/index.global.js"></script>
<style>
  /* Park preview canvas */
  .park-preview {
    background: linear-gradient(135deg, #2d4a1e 0%, #3a5c28 30%, #4a7035 55%, #3d5a25 80%, #2a4318 100%);
    border-radius: 8px;
    position: relative;
    overflow: hidden;
    height: 160px;
    width: 100%;
  }
  /* Subtle terrain texture */
  .park-preview::before {
    content: '';
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 80px 40px at 20% 30%, rgba(100,140,60,0.3) 0%, transparent 70%),
      radial-gradient(ellipse 60px 30px at 75% 70%, rgba(80,120,45,0.25) 0%, transparent 70%),
      radial-gradient(ellipse 40px 20px at 50% 50%, rgba(120,160,70,0.15) 0%, transparent 70%);
  }
  /* Road/path on map */
  .park-preview .road {
    position: absolute;
    background: rgba(210,195,165,0.5);
    border-radius: 3px;
  }

  /* SVG animations */
  svg.path-anim { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }

  /* Option A: marching ants (current) */
  @keyframes march-A {
    to { stroke-dashoffset: -56; }
  }
  .opt-A-line {
    fill: none; stroke: #5a7fa0; stroke-width: 3;
    stroke-dasharray: 14 10;
    animation: march-A 1.2s linear infinite;
    stroke-opacity: 0.85;
  }

  /* Option B: halo glow + thicker dashes */
  @keyframes march-B {
    to { stroke-dashoffset: -56; }
  }
  .opt-B-glow {
    fill: none; stroke: #5a7fa0; stroke-width: 10;
    stroke-opacity: 0.22;
    filter: blur(3px);
    stroke-linecap: round; stroke-linejoin: round;
  }
  .opt-B-mid {
    fill: none; stroke: #7aaed4; stroke-width: 5;
    stroke-opacity: 0.4;
    filter: blur(1px);
    stroke-linecap: round; stroke-linejoin: round;
  }
  .opt-B-line {
    fill: none; stroke: #8ec8ee; stroke-width: 4;
    stroke-dasharray: 16 10;
    animation: march-B 1.2s linear infinite;
    stroke-opacity: 0.95;
    stroke-linecap: round;
  }

  /* Option C: warm amber, pulsing */
  @keyframes pulse-C {
    0%, 100% { stroke-opacity: 0.95; }
    50% { stroke-opacity: 0.45; }
  }
  @keyframes pulse-glow-C {
    0%, 100% { stroke-opacity: 0.3; }
    50% { stroke-opacity: 0.08; }
  }
  @keyframes march-C {
    to { stroke-dashoffset: -60; }
  }
  .opt-C-glow {
    fill: none; stroke: #f59e0b; stroke-width: 9;
    stroke-opacity: 0.3;
    filter: blur(4px);
    animation: pulse-glow-C 1.8s ease-in-out infinite;
    stroke-linecap: round;
  }
  .opt-C-line {
    fill: none; stroke: #fbbf24; stroke-width: 5;
    stroke-dasharray: 14 9;
    stroke-linecap: round;
    animation: march-C 1.0s linear infinite, pulse-C 1.8s ease-in-out infinite;
  }

  /* Option D: white core + blue halo */
  @keyframes march-D {
    to { stroke-dashoffset: -52; }
  }
  @keyframes breathe-D {
    0%, 100% { stroke-opacity: 0.5; }
    50% { stroke-opacity: 0.15; }
  }
  .opt-D-glow {
    fill: none; stroke: #60a5fa; stroke-width: 12;
    stroke-opacity: 0.4;
    filter: blur(5px);
    animation: breathe-D 2s ease-in-out infinite;
    stroke-linecap: round;
  }
  .opt-D-halo {
    fill: none; stroke: #93c5fd; stroke-width: 6;
    stroke-opacity: 0.55;
    filter: blur(1.5px);
    stroke-linecap: round;
  }
  .opt-D-line {
    fill: none; stroke: #ffffff; stroke-width: 3;
    stroke-dasharray: 12 9;
    animation: march-D 1.1s linear infinite;
    stroke-opacity: 0.98;
    stroke-linecap: round;
  }

  /* Selection ring */
  .option-card {
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .option-card:hover { transform: translateY(-2px); }
  .option-card.selected {
    outline: 2px solid #60a5fa;
    outline-offset: 2px;
  }

  /* Code block */
  .props-block {
    font-family: 'Courier New', monospace;
    font-size: 0.68rem;
    line-height: 1.6;
    background: rgba(0,0,0,0.4);
    border-radius: 6px;
    padding: 8px 10px;
    color: #94a3b8;
    overflow-x: auto;
    white-space: pre;
  }
  .props-block .key { color: #7dd3fc; }
  .props-block .val { color: #86efac; }
  .props-block .comment { color: #64748b; }
</style>
</head>
<body class="min-h-screen p-6" style="background: #0f1117;">

<div class="max-w-4xl mx-auto">
  <!-- Header -->
  <div class="mb-6">
    <h1 class="text-2xl font-bold text-white mb-1">Nav Path Animation</h1>
    <p class="text-slate-400 text-sm">Pick the line style for the walking navigation overlay. All options use the same Dijkstra route — only the visual treatment changes.</p>
  </div>

  <!-- Option grid -->
  <form id="pick-form" onsubmit="handleSubmit(event)">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">

      <!-- Option A: Current (baseline) -->
      <label class="option-card card card-border bg-base-200 cursor-pointer" data-option="A">
        <input type="radio" name="option" value="A" class="hidden">
        <div class="card-body p-4 gap-3">
          <div class="flex items-start justify-between">
            <div>
              <span class="badge badge-outline badge-sm mb-1">Current</span>
              <h2 class="font-bold text-base text-white">A — Marching Dashes</h2>
              <p class="text-xs text-slate-400 mt-0.5">Thin, dashed, single color. Subtle but low contrast on green.</p>
            </div>
            <div class="w-5 h-5 rounded-full border-2 border-slate-500 flex items-center justify-center shrink-0 mt-1 radio-indicator">
              <div class="w-2.5 h-2.5 rounded-full bg-blue-400 hidden check-dot"></div>
            </div>
          </div>

          <div class="park-preview">
            <svg class="path-anim" viewBox="0 0 300 160">
              <path class="opt-A-line" d="M 20 130 C 60 110, 80 90, 110 80 C 140 70, 160 65, 190 60 C 220 55, 250 50, 280 40"/>
            </svg>
          </div>

          <div class="props-block"><span class="comment">// MapLibre paint — single layer</span>
<span class="key">'line-color'</span>: <span class="val">'#5a7fa0'</span>,
<span class="key">'line-width'</span>: <span class="val">3</span>,
<span class="key">'line-opacity'</span>: <span class="val">0.85</span>,
<span class="key">'line-dasharray'</span>: animated <span class="comment">// 14-frame seq</span></div>
        </div>
      </label>

      <!-- Option B: Halo glow -->
      <label class="option-card card card-border bg-base-200 cursor-pointer" data-option="B">
        <input type="radio" name="option" value="B" class="hidden">
        <div class="card-body p-4 gap-3">
          <div class="flex items-start justify-between">
            <div>
              <span class="badge badge-info badge-outline badge-sm mb-1">Recommended</span>
              <h2 class="font-bold text-base text-white">B — Halo Glow</h2>
              <p class="text-xs text-slate-400 mt-0.5">Blurred outer glow + brighter dashed core. Reads clearly on any terrain.</p>
            </div>
            <div class="w-5 h-5 rounded-full border-2 border-slate-500 flex items-center justify-center shrink-0 mt-1 radio-indicator">
              <div class="w-2.5 h-2.5 rounded-full bg-blue-400 hidden check-dot"></div>
            </div>
          </div>

          <div class="park-preview">
            <svg class="path-anim" viewBox="0 0 300 160" style="overflow:visible">
              <defs>
                <filter id="blur3"><feGaussianBlur stdDeviation="3"/></filter>
                <filter id="blur1"><feGaussianBlur stdDeviation="1"/></filter>
              </defs>
              <path class="opt-B-glow" filter="url(#blur3)" d="M 20 130 C 60 110, 80 90, 110 80 C 140 70, 160 65, 190 60 C 220 55, 250 50, 280 40"/>
              <path class="opt-B-mid" filter="url(#blur1)" d="M 20 130 C 60 110, 80 90, 110 80 C 140 70, 160 65, 190 60 C 220 55, 250 50, 280 40"/>
              <path class="opt-B-line" d="M 20 130 C 60 110, 80 90, 110 80 C 140 70, 160 65, 190 60 C 220 55, 250 50, 280 40"/>
            </svg>
          </div>

          <div class="props-block"><span class="comment">// 3 layers, same GeoJSON source</span>
<span class="key">'line-color'</span>: <span class="val">'#5a7fa0'</span>, <span class="key">width</span>: <span class="val">10</span>, <span class="key">opacity</span>: <span class="val">0.22</span>, <span class="key">blur</span>: <span class="val">3</span>
<span class="key">'line-color'</span>: <span class="val">'#7aaed4'</span>, <span class="key">width</span>: <span class="val">5</span>, <span class="key">opacity</span>: <span class="val">0.40</span>, <span class="key">blur</span>: <span class="val">1</span>
<span class="key">'line-color'</span>: <span class="val">'#8ec8ee'</span>, <span class="key">width</span>: <span class="val">4</span>, <span class="key">opacity</span>: <span class="val">0.95</span>, dash <span class="comment">anim</span></div>
        </div>
      </label>

      <!-- Option C: Warm amber pulse -->
      <label class="option-card card card-border bg-base-200 cursor-pointer" data-option="C">
        <input type="radio" name="option" value="C" class="hidden">
        <div class="card-body p-4 gap-3">
          <div class="flex items-start justify-between">
            <div>
              <span class="badge badge-warning badge-outline badge-sm mb-1">High contrast</span>
              <h2 class="font-bold text-base text-white">C — Amber Pulse</h2>
              <p class="text-xs text-slate-400 mt-0.5">Warm amber, pulsing opacity. High visibility on green. Different vibe — more urgent/GPS-y.</p>
            </div>
            <div class="w-5 h-5 rounded-full border-2 border-slate-500 flex items-center justify-center shrink-0 mt-1 radio-indicator">
              <div class="w-2.5 h-2.5 rounded-full bg-blue-400 hidden check-dot"></div>
            </div>
          </div>

          <div class="park-preview">
            <svg class="path-anim" viewBox="0 0 300 160" style="overflow:visible">
              <defs>
                <filter id="blur4"><feGaussianBlur stdDeviation="4"/></filter>
              </defs>
              <path class="opt-C-glow" filter="url(#blur4)" d="M 20 130 C 60 110, 80 90, 110 80 C 140 70, 160 65, 190 60 C 220 55, 250 50, 280 40"/>
              <path class="opt-C-line" d="M 20 130 C 60 110, 80 90, 110 80 C 140 70, 160 65, 190 60 C 220 55, 250 50, 280 40"/>
            </svg>
          </div>

          <div class="props-block"><span class="comment">// 2 layers + opacity pulse via JS</span>
<span class="key">'line-color'</span>: <span class="val">'#f59e0b'</span>, <span class="key">width</span>: <span class="val">9</span>, <span class="key">opacity</span>: <span class="val">pulsed</span>, <span class="key">blur</span>: <span class="val">4</span>
<span class="key">'line-color'</span>: <span class="val">'#fbbf24'</span>, <span class="key">width</span>: <span class="val">5</span>, <span class="key">opacity</span>: <span class="val">pulsed</span>, dash <span class="comment">anim</span>
<span class="comment">// pulse: 0.95 → 0.45 at 1.8s ease-in-out</span></div>
        </div>
      </label>

      <!-- Option D: White core + blue halo -->
      <label class="option-card card card-border bg-base-200 cursor-pointer" data-option="D">
        <input type="radio" name="option" value="D" class="hidden">
        <div class="card-body p-4 gap-3">
          <div class="flex items-start justify-between">
            <div>
              <span class="badge badge-ghost badge-outline badge-sm mb-1">GPS-app style</span>
              <h2 class="font-bold text-base text-white">D — White Core + Blue Halo</h2>
              <p class="text-xs text-slate-400 mt-0.5">White dashes with breathing blue aura. Maximum legibility, familiar nav-app feel.</p>
            </div>
            <div class="w-5 h-5 rounded-full border-2 border-slate-500 flex items-center justify-center shrink-0 mt-1 radio-indicator">
              <div class="w-2.5 h-2.5 rounded-full bg-blue-400 hidden check-dot"></div>
            </div>
          </div>

          <div class="park-preview">
            <svg class="path-anim" viewBox="0 0 300 160" style="overflow:visible">
              <defs>
                <filter id="blur5"><feGaussianBlur stdDeviation="5"/></filter>
                <filter id="blur1b"><feGaussianBlur stdDeviation="1.5"/></filter>
              </defs>
              <path class="opt-D-glow" filter="url(#blur5)" d="M 20 130 C 60 110, 80 90, 110 80 C 140 70, 160 65, 190 60 C 220 55, 250 50, 280 40"/>
              <path class="opt-D-halo" filter="url(#blur1b)" d="M 20 130 C 60 110, 80 90, 110 80 C 140 70, 160 65, 190 60 C 220 55, 250 50, 280 40"/>
              <path class="opt-D-line" d="M 20 130 C 60 110, 80 90, 110 80 C 140 70, 160 65, 190 60 C 220 55, 250 50, 280 40"/>
            </svg>
          </div>

          <div class="props-block"><span class="comment">// 3 layers + breathing glow via JS</span>
<span class="key">'line-color'</span>: <span class="val">'#60a5fa'</span>, <span class="key">width</span>: <span class="val">12</span>, <span class="key">opacity</span>: <span class="val">breathed</span>, <span class="key">blur</span>: <span class="val">5</span>
<span class="key">'line-color'</span>: <span class="val">'#93c5fd'</span>, <span class="key">width</span>: <span class="val">6</span>,  <span class="key">opacity</span>: <span class="val">0.55</span>, <span class="key">blur</span>: <span class="val">1.5</span>
<span class="key">'line-color'</span>: <span class="val">'#ffffff'</span>, <span class="key">width</span>: <span class="val">3</span>,  <span class="key">opacity</span>: <span class="val">0.98</span>, dash <span class="comment">anim</span></div>
        </div>
      </label>

    </div>

    <!-- Submit -->
    <div class="flex items-center gap-4">
      <button type="submit" class="btn btn-primary px-8" id="submit-btn" disabled>
        Use this option →
      </button>
      <p class="text-slate-500 text-sm" id="submit-hint">Select an option above</p>
    </div>
  </form>
</div>

<script>
  let selected = null

  document.querySelectorAll('.option-card').forEach(card => {
    card.addEventListener('click', () => {
      const val = card.dataset.option
      selected = val

      // Update radio
      card.querySelector('input[type=radio]').checked = true

      // Visual selection state
      document.querySelectorAll('.option-card').forEach(c => {
        c.classList.remove('selected')
        c.querySelector('.check-dot').classList.add('hidden')
        c.querySelector('.radio-indicator').classList.remove('border-blue-400')
        c.querySelector('.radio-indicator').classList.add('border-slate-500')
      })
      card.classList.add('selected')
      card.querySelector('.check-dot').classList.remove('hidden')
      card.querySelector('.radio-indicator').classList.remove('border-slate-500')
      card.querySelector('.radio-indicator').classList.add('border-blue-400')

      // Enable submit
      document.getElementById('submit-btn').disabled = false
      const names = { A: 'A — Marching Dashes', B: 'B — Halo Glow', C: 'C — Amber Pulse', D: 'D — White Core + Blue Halo' }
      document.getElementById('submit-hint').textContent = 'Selected: ' + names[val]
    })
  })

  function handleSubmit(e) {
    e.preventDefault()
    if (!selected) return

    const labels = {
      A: 'Option A — Marching Dashes (current, no change)',
      B: 'Option B — Halo Glow (3 layers: blurred outer glow + mid glow + bright dashed core, blue palette)',
      C: 'Option C — Amber Pulse (warm amber color, pulsing opacity glow)',
      D: 'Option D — White Core + Blue Halo (white dashes + breathing blue aura, 3 layers)'
    }

    if (window.lavish) {
      window.lavish.queuePrompt(
        'Implement ' + labels[selected] + ' for the nav-path-line MapLibre animation.',
        {
          tag: 'option-selected',
          text: 'Option ' + selected,
          data: { question: 'nav-path-animation', answer: selected }
        }
      )
      document.getElementById('submit-hint').textContent = '✓ Queued — press "Send to Agent" to confirm'
      document.getElementById('submit-btn').textContent = 'Queued ✓'
      document.getElementById('submit-btn').disabled = true
    } else {
      alert('Selected: ' + labels[selected])
    }
  }
</script>
</body>
</html>
