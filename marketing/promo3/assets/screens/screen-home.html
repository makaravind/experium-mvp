<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, height=788">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --forest:#588157; --forest-shadow:#3f6b3a;
  --orange:#dda15e; --orange-shadow:#b8834a;
  --sage:#a3b18a; --ink:#2b2b2b; --muted:#8a8a8a;
  --bg:#f8f7f4; --border:#e8e5df; --paper:#ffffff;
  --shadow-press-green:0 4px 0 var(--forest-shadow);
  --shadow-press-orange:0 4px 0 var(--orange-shadow);
  --shadow-press-orange-active:0 1px 0 var(--orange-shadow);
  --shadow-soft:0 2px 10px rgba(43,43,43,.08);
  --r:12px;
  --font-display:'Baloo 2','Outfit',system-ui,sans-serif;
  --font-body:'Nunito',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:390px;height:788px;
  background:transparent;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased;
}
.phone{width:390px;height:788px;background:#111;border-radius:52px;padding:11px;box-shadow:0 24px 60px rgba(43,43,43,.22);position:relative}
.screen{position:relative;width:100%;height:100%;border-radius:42px;overflow:hidden;background:var(--bg)}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:112px;height:31px;background:#111;border-radius:20px;z-index:60}
.statusbar{position:absolute;top:0;left:0;right:0;height:52px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 8px;font-weight:800;font-size:14px;z-index:50}
.sb-icons{display:flex;gap:6px;align-items:center;color:var(--ink)}
.sb-icons svg{fill:currentColor}
.home-ind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:132px;height:5px;border-radius:3px;background:var(--ink);opacity:.28;z-index:55}
.content{position:absolute;top:52px;left:0;right:0;bottom:0;padding:20px 22px 110px;display:flex;flex-direction:column}
.greet{font-family:var(--font-display);font-weight:800;font-size:24px;letter-spacing:-.01em}
.greet .leaf{color:var(--forest)}
.greet-sub{color:var(--muted);font-size:14px;font-weight:600;margin-top:2px}
.trail-card{background:var(--paper);border:1px solid var(--border);border-radius:18px;padding:20px 18px;margin-top:20px;box-shadow:var(--shadow-soft)}
.trail-lead{font-family:var(--font-display);font-weight:700;font-size:16px;line-height:1.3}
.trail-lead .hl{color:var(--forest)}
.trail-lead .hlo{color:var(--orange-shadow)}
.trail{display:flex;align-items:center;margin:20px 4px 8px;position:relative}
.node{width:26px;height:26px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;position:relative;z-index:2;font-size:11px;font-weight:800;color:#fff}
.node.hollow{background:transparent;border:2.5px solid var(--sage);color:var(--sage)}
.node.done{background:var(--forest);box-shadow:0 2px 0 var(--forest-shadow)}
.node.done svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:3}
.node.target{background:var(--orange);box-shadow:0 0 0 5px color-mix(in srgb,var(--orange) 30%,transparent),0 2px 0 var(--orange-shadow)}
.seg{height:4px;flex:1;background:var(--border);position:relative;z-index:1;margin:0 -2px}
.seg.fill{background:var(--forest)}
.trail-meta{font-size:13px;color:var(--muted);font-weight:600;margin-top:12px}
.spacer{flex:1}
.scan-now{width:100%;height:66px;border:none;border-radius:16px;background:var(--orange);color:#fff;font-family:var(--font-body);font-weight:800;font-size:19px;letter-spacing:.08em;text-transform:uppercase;box-shadow:var(--shadow-press-orange);display:flex;align-items:center;justify-content:center;gap:11px}
.scan-now svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2.3}
.explore{width:100%;height:52px;margin-top:14px;border:1.5px solid var(--sage);border-radius:14px;background:var(--paper);color:var(--ink);font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;gap:7px}
.ad{margin-top:auto;border-top:1px solid var(--border);padding-top:14px;display:flex;align-items:center;gap:12px}
.ad-thumb{width:44px;height:44px;border-radius:8px;background:linear-gradient(135deg,#d9c39a,#c9a86f);flex:0 0 auto}
.ad-txt{flex:1;min-width:0}
.ad-tag{font-size:9.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.ad-h{font-size:13.5px;font-weight:700;line-height:1.25;margin-top:1px}
.ad-cta{font-size:12px;font-weight:800;color:var(--orange)}
.tabbar{position:absolute;left:16px;right:16px;bottom:26px;height:66px;background:var(--paper);border:1px solid var(--border);border-radius:28px;box-shadow:0 8px 26px rgba(43,43,43,.14);display:flex;align-items:center;justify-content:space-around;z-index:40}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:800;font-size:10.5px;color:var(--muted);flex:1;text-align:center;border:none;background:none;font-family:inherit;padding:0}
.tab svg{width:24px;height:24px;stroke:var(--muted);fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.tab.active{color:var(--forest)}.tab.active svg{stroke:var(--forest)}
.tab.scan{margin-top:-24px;flex:0 0 auto}
.scan-btn{width:62px;height:62px;border-radius:50%;background:var(--orange);display:grid;place-items:center;box-shadow:var(--shadow-press-orange);border:3px solid var(--paper)}
.scan-btn svg{width:28px;height:28px;stroke:#fff;stroke-width:2.3;fill:none}
.tab.scan span{margin-top:6px;color:var(--orange)}
.leaf-i{width:20px;height:20px;stroke:var(--forest);fill:none;stroke-width:2;vertical-align:-3px}
</style>
</head>
<body>
<div class="phone"><div class="screen">
  <div class="island"></div>
  <div class="statusbar"><span>9:41</span><span class="sb-icons"><svg viewBox="0 0 20 13" width="18" height="12" aria-hidden="true"><rect x="0" y="8" width="3" height="5" rx="1"/><rect x="5" y="5" width="3" height="8" rx="1"/><rect x="10" y="2" width="3" height="11" rx="1"/><rect x="15" y="0" width="3" height="13" rx="1"/></svg><svg viewBox="0 0 26 13" width="24" height="12" aria-hidden="true"><rect x="1" y="1.5" width="21" height="10" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="3.5" y="4" width="14" height="5" rx="1.5"/><rect x="23.5" y="4.5" width="2" height="4" rx="1"/></svg></span></div>
  <div class="content">
    <div class="greet">Welcome back, <span class="leaf">Sam</span> <svg class="leaf-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C7 7 5 11 5 15a7 7 0 0 0 14 0c0-4-2-8-7-13Z"/><path d="M12 22V9"/></svg></div>
    <div class="greet-sub">You're on a roll — keep going.</div>
    <div class="trail-card">
      <div class="trail-lead"><span class="hl">7 of 50</span> discovered · <span class="hlo">3 more to your next badge!</span></div>
      <div class="trail" role="img">
        <div class="node done"><svg viewBox="0 0 24 24"><path d="m5 13 4 4L19 7"/></svg></div><div class="seg fill"></div>
        <div class="node done"><svg viewBox="0 0 24 24"><path d="m5 13 4 4L19 7"/></svg></div><div class="seg fill"></div>
        <div class="node done"><svg viewBox="0 0 24 24"><path d="m5 13 4 4L19 7"/></svg></div><div class="seg"></div>
        <div class="node target">10</div><div class="seg"></div>
        <div class="node hollow">20</div>
      </div>
      <div class="trail-meta">Milestones 1 · 3 · 5 earned — 10 is glowing just ahead.</div>
    </div>
    <div class="spacer"></div>
    <button class="scan-now">
      <svg viewBox="0 0 24 24"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2M4 12h16"/></svg>
      Scan Now
    </button>
    <button class="explore">Explore the Park →</button>
    <div class="ad">
      <div class="ad-thumb"></div>
      <div class="ad-txt"><div class="ad-tag">Sponsored</div><div class="ad-h">Butterfly Garden tickets — 20% off today</div></div>
      <div class="ad-cta">Open →</div>
    </div>
  </div>
  <nav class="tabbar">
    <button type="button" class="tab active"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 3l9 8"/><path d="M5 10v10h14V10"/></svg>Home</button>
    <button type="button" class="tab scan"><span class="scan-btn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2M4 12h16"/></svg></span><span>Scan</span></button>
    <button type="button" class="tab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3 3 5v16l6-2 6 2 6-2V3l-6 2-6-2Z"/><path d="M9 3v16M15 5v16"/></svg>Map</button>
  </nav>
  <div class="home-ind"></div>
</div></div>
</body>
</html>
