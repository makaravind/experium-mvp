<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, height=788">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --forest:#588157; --forest-shadow:#3f6b3a;
  --orange:#dda15e; --orange-shadow:#b8834a;
  --sage:#a3b18a; --ink:#2b2b2b; --muted:#8a8a8a;
  --bg:#f8f7f4; --border:#e8e5df; --paper:#ffffff;
  --shadow-press-green:0 4px 0 var(--forest-shadow);
  --shadow-press-orange:0 4px 0 var(--orange-shadow);
  --font-display:'Baloo 2','Outfit',system-ui,sans-serif;
  --font-body:'Nunito',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:390px;height:788px;
  background:transparent;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased;
}
.phone{width:390px;height:788px;background:#111;border-radius:52px;padding:11px;box-shadow:0 24px 60px rgba(43,43,43,.22);position:relative}
.screen{position:relative;width:100%;height:100%;border-radius:42px;overflow:hidden;background:var(--bg)}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:112px;height:31px;background:#111;border-radius:20px;z-index:60}
.statusbar{position:absolute;top:0;left:0;right:0;height:52px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 8px;font-weight:800;font-size:14px;z-index:50}
.home-ind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:132px;height:5px;border-radius:3px;background:var(--ink);opacity:.28;z-index:55}
/* Discovery card screen */
.s3{position:absolute;top:52px;left:0;right:0;bottom:0;padding:30px 22px;display:flex;flex-direction:column;align-items:center}
.s3-title{font-family:var(--font-display);font-weight:800;font-size:19px;text-align:center}
.s3-sub{color:var(--muted);font-size:13px;font-weight:600;margin-top:2px;text-align:center}
.dcard{width:100%;aspect-ratio:1/1;border-radius:20px;margin:auto 0;position:relative;overflow:hidden;box-shadow:0 14px 34px rgba(43,43,43,.24);background:linear-gradient(150deg,#6f8f56 0%,#4d6b46 55%,#b8834a 130%)}
.dcard:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 26% 22%,rgba(255,255,255,.28),transparent 46%)}
.dcard-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px;color:#fff;z-index:2}
.dcard-badge{width:104px;height:104px;border-radius:50%;border:3px dashed rgba(255,255,255,.5);display:grid;place-items:center;margin-bottom:18px}
.dcard-badge div{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.4);display:grid;place-items:center}
.dcard-badge svg{width:38px;height:38px;stroke:#fff;fill:none;stroke-width:1.8}
.dcard-count{font-family:var(--font-display);font-weight:800;font-size:40px;line-height:1}
.dcard-name{font-family:var(--font-display);font-weight:700;font-size:18px;margin-top:8px}
.dcard-eyebrow{font-weight:800;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.72);margin-top:12px}
.btn-download{width:100%;height:56px;margin-top:22px;border:none;border-radius:14px;background:var(--forest);color:#fff;font-family:var(--font-body);font-weight:800;font-size:16px;box-shadow:var(--shadow-press-green);display:flex;align-items:center;justify-content:center;gap:9px}
.btn-download svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.2}
</style>
</head>
<body>
<div class="phone"><div class="screen">
  <div class="island"></div>
  <div class="statusbar"><span>9:41</span></div>
  <div class="s3">
    <div class="s3-title">Your Discovery Card</div>
    <div class="s3-sub">Save it or share it — no name attached.</div>
    <div class="dcard">
      <div class="dcard-inner">
        <div class="dcard-badge"><div><svg viewBox="0 0 24 24"><path d="M12 2C7 7 5 11 5 15a7 7 0 0 0 14 0c0-4-2-8-7-13Z"/><path d="M12 22V9"/></svg></div></div>
        <div class="dcard-count">10</div>
        <div class="dcard-name">Experium Park Explorer</div>
        <div class="dcard-eyebrow">Exhibits discovered</div>
      </div>
    </div>
    <button class="btn-download">
      <svg viewBox="0 0 24 24"><path d="M12 3v13M7 11l5 5 5-5M5 21h14"/></svg>
      Download
    </button>
  </div>
  <div class="home-ind"></div>
</div></div>
</body>
</html>
