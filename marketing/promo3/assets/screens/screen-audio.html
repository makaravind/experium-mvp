<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, height=788">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --forest:#588157; --forest-shadow:#3f6b3a;
  --orange:#dda15e; --orange-shadow:#b8834a;
  --sage:#a3b18a; --ink:#2b2b2b; --muted:#8a8a8a;
  --bg:#f8f7f4; --border:#e8e5df; --paper:#ffffff;
  --gps:#4a90d9;
  --shadow-press-green:0 4px 0 var(--forest-shadow);
  --shadow-press-green-active:0 1px 0 var(--forest-shadow);
  --shadow-press-orange:0 4px 0 var(--orange-shadow);
  --shadow-press-orange-active:0 1px 0 var(--orange-shadow);
  --shadow-sheet:0 -8px 32px rgba(43,43,43,.12);
  --shadow-soft:0 2px 10px rgba(43,43,43,.08);
  --r:12px;
  --font-display:'Baloo 2','Outfit',system-ui,sans-serif;
  --font-body:'Nunito',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:390px;height:788px;
  background:transparent;
  overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased;
}
.phone{width:390px;height:788px;background:#111;border-radius:52px;padding:11px;box-shadow:0 24px 60px rgba(43,43,43,.22);position:relative;flex:0 0 auto}
.screen{position:relative;width:100%;height:100%;border-radius:42px;overflow:hidden;background:var(--bg);isolation:isolate}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:112px;height:31px;background:#111;border-radius:20px;z-index:60}
.statusbar{position:absolute;top:0;left:0;right:0;height:52px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 8px;font-weight:800;font-size:14px;color:var(--ink);z-index:50}
.statusbar.on-dark{color:#fff}
.sb-icons{display:flex;gap:6px;align-items:center;color:inherit}
.sb-icons svg{fill:currentColor}
.home-ind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:132px;height:5px;border-radius:3px;background:var(--ink);opacity:.28;z-index:55}
.home-ind.on-dark{background:#fff;opacity:.6}
button{font-family:inherit}
.player-scrim{position:absolute;inset:0;background:rgba(43,43,43,.12);z-index:34}
.player{position:absolute;inset:0;background:var(--paper);z-index:35;display:flex;flex-direction:column;padding:60px 20px 0}
.close-btn{position:absolute;top:60px;right:20px;width:32px;height:32px;border-radius:50%;background:var(--bg);display:grid;place-items:center;color:var(--ink);z-index:2;border:none;cursor:pointer}
.close-btn svg{width:16px;height:16px;stroke:currentColor;stroke-width:2.4;fill:none}
.hero{width:calc(100% + 40px);aspect-ratio:1/1;border-radius:0;overflow:hidden;position:relative;background:linear-gradient(160deg,#6f9557,#456a3f);margin:0 -20px}
.hero:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.4),transparent 45%),radial-gradient(circle at 80% 90%,rgba(43,43,43,.28),transparent 50%)}
.gallery-counter{position:absolute;bottom:12px;right:12px;background:rgba(43,43,43,.52);backdrop-filter:blur(4px);color:#fff;font-weight:800;font-size:12px;padding:5px 10px;border-radius:999px;z-index:3;letter-spacing:.04em}
.thumb-strip{display:flex;gap:8px;padding:10px 0;justify-content:center}
.t-thumb{width:60px;height:48px;border-radius:8px;background:linear-gradient(135deg,#7fa06a,#4d6b46);position:relative;overflow:hidden;cursor:pointer;border:2px solid transparent;flex:0 0 auto}
.t-thumb:after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(120,170,90,.4),rgba(40,70,30,.3))}
.t-thumb.on{border-color:var(--forest)}
.t-thumb:nth-child(2){background:linear-gradient(135deg,#5c7e4e,#3d5836)}
.t-thumb:nth-child(3){background:linear-gradient(135deg,#7aa863,#4d6b42)}
.t-thumb:nth-child(4){background:linear-gradient(135deg,#8ab87a,#567a46)}
.player-name{font-family:var(--font-display);font-weight:700;font-size:20px;margin-top:4px}
.player-sci{font-style:italic;font-size:12px;color:var(--muted);margin-top:2px}
.player-body{display:flex;flex-direction:column;gap:12px;flex:1}
.player-controls{display:flex;align-items:center;gap:16px}
.ring-sm{position:relative;width:80px;height:80px;flex:0 0 auto}
.ring-sm svg{transform:rotate(-90deg)}
.ring-sm .track{fill:none;stroke:var(--border);stroke-width:5}
.ring-sm .prog{fill:none;stroke:var(--forest);stroke-width:5;stroke-linecap:round;stroke-dasharray:270;stroke-dashoffset:145}
.play-sm{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;background:var(--forest);display:grid;place-items:center;box-shadow:var(--shadow-press-green);border:none;cursor:pointer}
.play-sm svg{width:22px;height:22px;fill:#fff}
.controls-right{flex:1;display:flex;flex-direction:column;gap:6px}
.pbar-thin{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.pbar-thin-fill{width:47%;height:100%;background:var(--forest);border-radius:2px}
.time{font-weight:700;font-size:14px;color:var(--muted);margin-top:16px;font-variant-numeric:tabular-nums}
.time b{color:var(--ink)}
.learn{margin-top:16px;font-weight:700;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:4px;background:none;border:none;cursor:pointer}
.learn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.4}
.ad{position:absolute;left:0;right:0;bottom:0;border-top:1px solid var(--border);padding:12px 20px 26px;display:flex;align-items:center;gap:12px;background:var(--paper);z-index:2}
.ad-thumb{width:44px;height:44px;border-radius:8px;background:linear-gradient(135deg,#d9c39a,#c9a86f);flex:0 0 auto}
.ad-txt{flex:1;min-width:0}
.ad-tag{font-size:9.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.ad-h{font-size:13.5px;font-weight:700;line-height:1.25;margin-top:1px}
.ad-cta{font-size:12px;font-weight:800;color:var(--orange)}
</style>
</head>
<body>
<div class="phone"><div class="screen">
  <div class="island"></div>
  <div class="statusbar"><span>9:43</span><span class="sb-icons"><svg viewBox="0 0 20 13" width="18" height="12" aria-hidden="true"><rect x="0" y="8" width="3" height="5" rx="1"/><rect x="5" y="5" width="3" height="8" rx="1"/><rect x="10" y="2" width="3" height="11" rx="1"/><rect x="15" y="0" width="3" height="13" rx="1"/></svg><svg viewBox="0 0 26 13" width="24" height="12" aria-hidden="true"><rect x="1" y="1.5" width="21" height="10" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="3.5" y="4" width="14" height="5" rx="1.5"/><rect x="23.5" y="4.5" width="2" height="4" rx="1"/></svg></span></div>
  <div class="player-scrim"></div>
  <div class="player">
    <button class="close-btn" aria-label="Close player"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <div class="hero"><div class="gallery-counter">1 / 4</div></div>
    <div class="thumb-strip" role="group" aria-label="Gallery photos">
      <button type="button" class="t-thumb on" aria-label="Photo 1 of 4" aria-pressed="true"></button>
      <button type="button" class="t-thumb" aria-label="Photo 2 of 4" aria-pressed="false"></button>
      <button type="button" class="t-thumb" aria-label="Photo 3 of 4" aria-pressed="false"></button>
      <button type="button" class="t-thumb" aria-label="Photo 4 of 4" aria-pressed="false"></button>
    </div>
    <div class="player-body">
      <div>
        <div class="player-name">Flame of the Forest</div>
        <div class="player-sci">Butea monosperma</div>
      </div>
      <div class="player-controls">
        <div class="ring-sm">
          <svg width="80" height="80" viewBox="0 0 96 96" aria-hidden="true"><circle class="track" cx="48" cy="48" r="43"/><circle class="prog" cx="48" cy="48" r="43"/></svg>
          <button class="play-sm" aria-label="Pause"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
        </div>
        <div class="controls-right">
          <div class="pbar-thin"><div class="pbar-thin-fill"></div></div>
          <div class="time"><b>0:34</b> / 1:12</div>
          <button class="learn">Learn more <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
        </div>
      </div>
    </div>
    <div class="ad">
      <div class="ad-thumb"></div>
      <div class="ad-txt"><div class="ad-tag">Sponsored</div><div class="ad-h">Refuel at Green Leaf Cafe</div></div>
      <div class="ad-cta">Open →</div>
    </div>
  </div>
  <div class="home-ind"></div>
</div></div>
</body>
</html>
