    (function () {
      var tl = gsap.timeline({ paused: true });

      /* Fade in */

      /* Album pops in */

      /* Album ring pulses */

      tl.fromTo('#aud-album-ring', { scale: 1, opacity: 0.4, immediateRender: false }, { scale: 1.18, opacity: 0, duration: 0.9, ease: 'power1.out' }, 1.7);
      tl.fromTo('#aud-album-ring', { scale: 1, opacity: 0.4, immediateRender: false }, { scale: 1.18, opacity: 0, duration: 0.9, ease: 'power1.out' }, 2.7);

      /* Track title slides up */
      tl.fromTo('#aud-track', { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power3.out' }, 0.4);

      /* Waveform bars fade + animate in */
      tl.fromTo('#aud-waveform-wrap', { opacity: 0, scaleY: 0.4 }, { opacity: 1, scaleY: 1, duration: 0.4, ease: 'power2.out', transformOrigin: 'bottom' }, 0.55);

      /* Each bar oscillates independently */
      var bars = ['aw-1','aw-2','aw-3','aw-4','aw-5','aw-6','aw-7','aw-8','aw-9','aw-10',
                  'aw-11','aw-12','aw-13','aw-14','aw-15','aw-16','aw-17','aw-18','aw-19','aw-20',
                  'aw-21','aw-22','aw-23','aw-24','aw-25'];

                    0.37,0.28,0.34,0.26,0.43];
      bars.forEach(function(id, i) {
        var rep = Math.floor(2.8 / (speeds[i] * 2));
        tl.fromTo('#' + id, { scaleY: 0.3 }, { scaleY: 1, duration: speeds[i], ease: 'sine.inOut', yoyo: true, repeat: rep, transformOrigin: 'bottom' }, 0.55 + (i % 5) * 0.04);
